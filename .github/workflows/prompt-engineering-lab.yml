name: Prompt Engineering Lab

on:
  pull_request:
    paths:
      - "prompt-engineering/**"
      - ".github/workflows/prompt-engineering-lab.yml"
  push:
    branches: [main]
    paths:
      - "prompt-engineering/**"
      - ".github/workflows/prompt-engineering-lab.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompt-engineering/materials-prompt-engineering
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prompt-engineering/materials-prompt-engineering/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
